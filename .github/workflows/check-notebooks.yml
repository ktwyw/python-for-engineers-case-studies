name: Check notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packages
        run: python -m pip install -r requirements-dev.txt
      - name: Static checks (comments, structure, saved outputs)
        run: python tests/check_notebooks.py
      - name: Run every notebook from top to bottom
        run: python tests/run_notebooks.py
